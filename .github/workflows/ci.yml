name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          sudo xcode-select -s "${XCODE:-/Applications/Xcode.app}"
          xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      # Unsigned: CI has no Developer ID and only needs to answer "does it compile".
      - name: Build (Release, unsigned)
        run: |
          xcodebuild -project Duckows.xcodeproj \
            -scheme Duckows \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

      # The test bundle is deliberately un-hosted, so this never launches
      # Duckows — which would mutate the runner's Dock.
      - name: Test
        run: |
          xcodebuild -project Duckows.xcodeproj \
            -scheme Duckows \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Shellcheck release script
        run: |
          brew install shellcheck
          shellcheck scripts/release.sh
